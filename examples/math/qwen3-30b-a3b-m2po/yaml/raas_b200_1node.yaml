# RaaS config — Qwen3-30B-A3B, 2 B200s beside the trainer (model0 DP=2, TP=1)
# Experiment: math / qwen3-30b-a3b-m2po
# Launch: --config experiment_b200_1node.yaml --config raas_b200_1node.yaml
# Same node as the trainer: the ~57 GiB full weight sync is a loopback transfer.

rollout:
  # 96 x 8 = 768 sequences in flight is the supply bound: a step needs 256 accepted samples and the
  # zero-adv filter drops ~40% of groups. Raise to 128 if timeperf/rollout_wait_fraction stays > 0.2;
  # 256 put every sample ~2.6 steps behind before it reached the buffer.
  max_concurrent_rollouts: 96
  max_concurrent_evals: 64
  pause_grace_period: 3
  # off: the telemetry poll starves behind the ~98 s full weight pull, availability clamps at 4 and
  # the trainer idles; static availability decouples them. Revisit with delta transfer.
  enable_adaptive_availability: false
  target_waiting_queue_per_dp: 4
  adaptive_step_size: 4
  load_cache_ttl_ms: 100

engine:
  model0:
    backend: sglang
    data_parallel_size: 2

sglang:
  context_length: 4096
  # 56.9 GiB of weights on a 183 GB card; 0.85 leaves ample KV headroom.
  mem_fraction_static: 0.85
  # R3: sglang sizes the capturer buffer from max(chunked_prefill_size, max_running_requests) per DP rank
  # and bounds every prefill batch by it, so any positive value works (build_args refuses -1).
  chunked_prefill_size: 32768
  max_running_requests: null
  skip_tokenizer_init: true
  enable_return_routed_experts: true
  # R3 on sm_100: "auto" picks flashinfer_trtllm, which bypasses select_experts and records nothing
  # (sglang itself would start and report healthy); triton keeps the capturing top-k path.
  moe_runner_backend: triton
  # Leave attention_backend unset (sglang auto-selects per arch).
